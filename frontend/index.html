<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Apple touch icon for iOS home-screen and Safari pinned tabs.
         Rasterized 180×180 PNG of the same Δ logomark — these surfaces
         don't render SVG favicons reliably. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Liganx — mutation-aware structural biology. Compare wild-type vs. mutant binding for any protein, any compound." />
    <title>Liganx — Mutation-aware structural biology</title>

    <!-- Social card metadata. The og-image.png in public/ is 1200x630 (LinkedIn /
         Slack / Twitter spec) so a shared liganx.com link unfurls with the
         brand mark + tagline instead of a blank preview. og: namespace covers
         Facebook / LinkedIn / Slack; the four twitter:* tags cover Twitter/X. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://liganx.com/" />
    <meta property="og:title" content="Liganx — Mutation-aware molecular docking" />
    <meta property="og:description" content="Pick a clinically relevant mutation. Pick your compounds. We dock against wild-type and mutant in parallel and show exactly which compounds gain selectivity." />
    <meta property="og:image" content="https://liganx.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Liganx — Mutation-aware molecular docking" />
    <meta name="twitter:description" content="WT vs mutant in one matrix. Vina + GNINA. Free for academic use." />
    <meta name="twitter:image" content="https://liganx.com/og-image.png" />
    <!-- Inline theme bootstrap: runs before React mounts so the .dark class
         is set on <html> before first paint. Prevents flash-of-wrong-theme
         when user has dark mode saved.
         Default for NEW users (no saved preference) is LIGHT mode regardless
         of the OS-level prefers-color-scheme. Liganx is a science tool first
         seen in marketing screenshots and shared links — light reads as the
         "default product look". Users on dark-mode systems can flip via the
         toggle, and that choice persists. -->
    <script>
      (function () {
        try {
          // Read the new key first; fall back to the legacy `deltadock-theme`
          // so a user's saved choice survives the rebrand on first load.
          var saved = localStorage.getItem("liganx-theme") || localStorage.getItem("deltadock-theme");
          // ONLY apply dark when the user has explicitly chosen it. New
          // users / cleared storage = light by default, not OS-following.
          if (saved === "dark") document.documentElement.classList.add("dark");
        } catch (_) { /* localStorage unavailable — silently default to light */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
