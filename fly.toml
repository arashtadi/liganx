# Fly.io app config for the Liganx backend.
#
# Region 'iad' (Ashburn, VA) — close to Supabase's us-east-2 cluster and the
# RunPod GPU Pod (eu-2 / us cluster, latency-tolerant). Single-machine deploy
# is fine for v1; the matrix workload is bursty per-job, not high-RPS.
#
# Deploy: from repo root, run `fly deploy --config fly.toml`. Secrets must
# already be set via `fly secrets set DATABASE_URL=... POD_DOCK_URL=...` etc.

app = "liganx-api"
primary_region = "iad"

[build]
  # Build context is the repo root (so /backend and /pipeline are both visible
  # to COPY). Dockerfile lives next to this fly.toml.
  dockerfile = "Dockerfile"

# Public HTTPS service on port 8000 inside the container.
[http_service]
  internal_port = 8000
  force_https = true
  # Don't scale to zero: cold starts pay the conda-env startup cost (10-15s)
  # and the FastAPI warm-up. Always keeping one machine on costs ~$5/mo and
  # gives instant first requests.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# Health check: hits /health which always returns 200 when the app is alive.
# 15s grace at start covers the conda env load.
[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

# Single process group; the entrypoint script (deploy/start.sh in the
# repo) runs BOTH a celery worker and uvicorn on the same machine so
# they share the pose-cache volume natively (Fly volumes are local
# block storage and can't be mounted across process groups).
#
# Deploy survival still works because the durable queue lives on the
# separate liganx-redis app — its machine isn't restarted by liganx-api
# deploys. With Celery task_acks_late=True, any task killed mid-flight
# by SIGTERM gets re-delivered to the next worker startup. The task is
# safe in Redis until it explicitly acks on completion.
[processes]
  app = ""

# Non-secret env. Real secrets (DATABASE_URL, POD_DOCK_URL, R2_*) live in
# `fly secrets` — never commit them here.
[env]
  APP_ENV = "production"
  LOG_LEVEL = "info"
  CORS_ORIGINS = "https://liganx.com,https://www.liganx.com"

# Resources — performance-2x because the receptor-prep step (PDBFixer +
# OpenMM) is single-threaded CPU-heavy and takes 2-3 min on shared-cpu-1x for
# a typical kinase domain (~330 residues). On performance-2x the same prep
# completes in ~20-40s. Docking itself dispatches to the GPU Pod so machine
# CPU still doesn't bottleneck the matrix throughput. ProLIF/PoseBusters
# subprocesses also run more reliably with 4 GB RAM headroom.
#
# Cost ≈ $30/mo. If you outgrow this, bump to performance-4x (4 vCPU/8 GB).
[[vm]]
  size = "performance-2x"
  memory = "4gb"
  cpus = 2

# Persistent volume for the pose store AND the PDB / receptor caches.
# Fly only supports one volume mount per machine, so we tuck the
# receptor and PDB caches inside the same mount under a `cache/`
# subdirectory. LIGANX_CACHE_ROOT is set to /var/lib/liganx/poses/cache
# so the runner's PDB_CACHE = $ROOT/pdb and RECEPTOR_CACHE = $ROOT/receptors
# both land on the persistent volume. POSE_CACHE_DIR keeps using the
# volume root (/var/lib/liganx/poses) so existing pose URLs in the DB
# stay valid.
#
# Why the cohabitation: previously the receptor cache lived on ephemeral
# disk and got wiped on every deploy, which meant the 3D viewer for any
# historical job would 404. Promoting it onto this volume fixes that
# without needing a second volume (which Fly machines don't support
# anyway). The volume is 1 GB and currently ~18 MB used; pdb +
# receptor caches together typically run under 100 MB.
[[mounts]]
  source = "liganx_pose_cache"
  destination = "/var/lib/liganx/poses"
  initial_size = "1gb"
