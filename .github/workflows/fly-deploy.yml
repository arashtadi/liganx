name: Fly Deploy

# Auto-deploys the backend to Fly.io on every push to main that touches the
# backend, pipeline, Dockerfile, or fly config. Frontend (Vercel) auto-deploys
# from the same push via Vercel's GitHub integration — no action needed here.
#
# A scientific-correctness gate runs BEFORE the deploy: backend/scripts/
# verify_catalog.py checks every catalog target's pocket centre against the
# RCSB co-crystal ligand and confirms every promoted mutation either fits
# inside its docking box or is on the documented outside-pocket exemption
# list. If verification fails, the deploy step never runs. This protects
# against the regression class that hit us on 2026-04-30 (17 of 40 mutations
# silently drifted outside their boxes after a prior pocket-coords fix).
#
# Required repo secret:
#   FLY_API_TOKEN  — generate locally with `fly auth token` and add at
#                    https://github.com/<org>/<repo>/settings/secrets/actions

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "pipeline/**"
      - "Dockerfile"
      - "fly.toml"
      - ".github/workflows/fly-deploy.yml"
  # Manual trigger from the Actions tab — useful for redeploying without a
  # code change (e.g., after rotating a secret).
  workflow_dispatch:

jobs:
  verify-catalog:
    name: Verify catalog scientific correctness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the prod runtime (3.12 in the Dockerfile). The verify
          # script is stdlib-only — no pip install needed — so we use the
          # plain interpreter.
          python-version: "3.12"
      - name: Run verify_catalog.py
        # The script imports backend/src/deltadock/catalog.py and downloads
        # each target's PDB from RCSB to confirm the configured pocket
        # centres match the canonical co-crystal ligand on chain A. Exits
        # non-zero on any regression. Exit 2 indicates a transient network
        # problem (RCSB timeout) and the workflow re-runs cleanly on retry.
        run: python backend/scripts/verify_catalog.py
      - name: Run verify_prep_symmetry.py
        # Structural check that runner.py + mutate.py preserve the v5
        # invariant: WT and mutant receptors honor the SAME per-target
        # minimize_mutant flag. Without this, the asymmetry that the
        # 2026-05-01 PhD audit caught (mutant minimised, WT not) silently
        # comes back and biases every Δ. Stdlib-only, no network.
        run: python backend/scripts/verify_prep_symmetry.py

  backend-tests:
    name: Backend tests + migration-wiring gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the prod runtime (3.12 in the Dockerfile).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Check migration wiring
        # Stdlib-only, no pip install needed — catches the bug class
        # behind the 2026-05-15 outage: a migration .sql file added to
        # backend/migrations/ but never wired into main.py's startup
        # runner. Run first so a wiring mistake fails in seconds rather
        # than after the (slower) dependency install below.
        run: python backend/scripts/check_schema_migrations.py
      - name: Install backend + dev deps
        # The Batch-5 unit tests import deltadock.main, which pulls in
        # the full router tree (rdkit, biopython, ...), so the whole
        # dependency set has to be installed even though the tests
        # themselves are pure-function.
        run: pip install -e "backend[dev]"
      - name: Run pytest (DB-free gate)
        # `-m "not requires_db"` skips the tests that boot the app
        # lifespan (test_health.py) — those need a live Postgres and run
        # in the parallel backend-tests-db job below. The remaining tests
        # are deterministic pure-function checks (the extra-format parser
        # parity + the $$-aware migration SQL splitter + the test-
        # isolation regression guard). conftest.py forces a safe
        # DATABASE_URL regardless of any env value, so the SQLAlchemy
        # engine that gets created is never dialed by these tests.
        working-directory: backend
        env:
          APP_SECRET: ci-test-secret
        run: pytest -m "not requires_db" -q

  backend-tests-db:
    name: Backend DB-dependent tests
    runs-on: ubuntu-latest
    # These requires_db tests boot the full app against a plain CI Postgres,
    # which lacks Supabase's protected `auth.users` schema — so they fail in
    # CI by construction (not a real regression). Marked non-blocking so a
    # known-unrunnable job doesn't red the whole workflow (and email the
    # owner) on every push. Re-tighten once CI seeds an auth.users stub.
    continue-on-error: true
    # Brings up a throwaway Postgres alongside the runner and points the
    # `requires_db` tests at it via TEST_DATABASE_URL (which conftest.py
    # consumes — see backend/tests/conftest.py). This exercises the FULL
    # boot lifespan against a real Postgres: SQLModel.create_all builds
    # the schema from current models, _run_startup_migrations replays the
    # idempotent ALTERs, _verify_schema_matches_models confirms the ORM
    # matches the DB, and the reaper init runs. test_health.py then
    # checks that auth gates the protected routes.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: liganx_test
        ports:
          - 5432:5432
        # Wait until pg_isready before the job starts hitting it.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend + dev deps
        run: pip install -e "backend[dev]"
      - name: Seed CI base schema (Supabase auth stub + user_profile base)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/liganx_test
        run: |
          python - <<'PY'
          import os, psycopg2
          # psycopg2 wants a plain postgresql:// URL (no SQLAlchemy +driver).
          url = os.environ["TEST_DATABASE_URL"].replace("+psycopg2", "")
          # The startup migration runner deliberately skips 001-010 (hand-applied
          # in prod), and user_profile is NOT a SQLModel model, so create_all
          # never builds it. Seed the auth stub + the user_profile base
          # migrations that only touch user_profile/auth (no model tables) so the
          # registered ADD COLUMN IF NOT EXISTS migrations have a table to extend.
          files = [
              "tests/ci_db_stub.sql",
              "migrations/003_user_profile.sql",
              "migrations/007_user_job_quota.sql",
              "migrations/008_role_other.sql",
          ]
          conn = psycopg2.connect(url)
          conn.autocommit = True
          for f in files:
              with conn.cursor() as cur:
                  cur.execute(open(f).read())
              print(f"applied {f}")
          conn.close()
          print("Seeded CI base schema.")
          PY
      - name: Run pytest (requires-db tests)
        working-directory: backend
        env:
          # conftest.py reads TEST_DATABASE_URL and unconditionally writes
          # it into DATABASE_URL before the app config loads — see the
          # belt-and-suspenders assertion there that rejects prod hosts.
          TEST_DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/liganx_test
          APP_SECRET: ci-test-secret
        run: pytest -m "requires_db" -q

  deploy:
    name: Deploy backend to Fly
    runs-on: ubuntu-latest
    # Deploys are done MANUALLY via flyctl from the Mac (see project docs),
    # so this CI deploy only runs on an explicit manual dispatch — never on
    # every push. This keeps push runs green (checks only) and avoids the
    # deploy job failing on pushes when it wasn't meant to run.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    # Blocking dependencies: only deploy after the scientific-correctness
    # catalog check, the DB-free unit gate, AND the DB-dependent tests
    # all pass. If any fails, the deploy step is skipped entirely —
    # broken science or a failing test never reaches production.
    needs: [verify-catalog, backend-tests, backend-tests-db]
    concurrency:
      # Cancel any in-flight deploy so a fresh push always wins.
      group: fly-deploy
      cancel-in-progress: false   # but let the current one finish cleanly
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        run: |
          flyctl deploy --remote-only --app liganx-api \
            --build-arg GIT_SHA="${GITHUB_SHA::7}" \
            --env GIT_SHA="${GITHUB_SHA::7}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
