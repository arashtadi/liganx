name: Refresh Validation Snapshot

# One-click refresh of the public /validation page on liganx.com.
#
# What this does:
#   1. Re-runs backend/scripts/validate_positive_controls.py against the
#      live API at api.liganx.com using a Supabase JWT you paste in.
#   2. Captures the run as JSON to frontend/public/validation_results.json.
#   3. Commits the refreshed JSON to main and pushes — the validation page
#      will read the new file the next time the frontend is deployed.
#   4. If VERCEL_TOKEN is set as a repo secret, also runs deploy-frontend.sh
#      so the new JSON is live on liganx.com immediately. Otherwise prints
#      a reminder to run the deploy script locally.
#
# Why workflow_dispatch only (not on schedule):
#   Supabase JWTs expire in 1 hour, so we cannot auto-schedule a weekly
#   cron without a long-lived service-token auth path. That path is on
#   the roadmap (a dedicated validation@liganx.com bot user with a
#   service-role key); until then this workflow is a manual button.
#   A manual button is honest about the limitation and still much better
#   than 'open terminal, export token, run script, commit, redeploy'.
#
# Security note about the JWT input:
#   GitHub Actions logs `workflow_dispatch` inputs in plaintext. The JWT
#   is sensitive — it's a 1-hour bearer token for your account. Treat
#   the workflow logs the same way you'd treat a browser DevTools
#   console screenshot. Don't share workflow run links externally; the
#   token expires in an hour anyway.

on:
  workflow_dispatch:
    inputs:
      bearer_token:
        description: "Supabase JWT (eyJ...) — get from a signed-in browser console: localStorage['sb-...auth-token'].access_token"
        required: true
        type: string

jobs:
  refresh:
    name: Re-run validation suite + commit refreshed JSON
    runs-on: ubuntu-latest
    permissions:
      # Need write to push the refreshed JSON back to main.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # We push back to main, so use a token that can do that. The
          # default GITHUB_TOKEN suffices because we only push the same
          # branch we checked out.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run validation suite
        env:
          LIGANX_BEARER_TOKEN: ${{ inputs.bearer_token }}
          LIGANX_VALIDATE_JSON_OUT: frontend/public/validation_results.json
        run: |
          python backend/scripts/validate_positive_controls.py

      - name: Commit refreshed JSON if changed
        run: |
          git config user.name  "liganx-validation-bot[bot]"
          git config user.email "liganx-validation-bot@users.noreply.github.com"
          if git diff --quiet frontend/public/validation_results.json; then
            echo "No change in validation_results.json — nothing to commit."
            exit 0
          fi
          git add frontend/public/validation_results.json
          git commit -m "Refresh validation snapshot via GH Actions

Auto-generated by .github/workflows/refresh-validation.yml.
"
          git push origin HEAD:main

      - name: Frontend deploy reminder
        # The Vercel project doesn't have GitHub auto-deploy wired up
        # (it's a cross-project alias to a separate 'liganx' Vercel
        # project — see deploy-frontend.sh for the rationale). Until
        # that's fixed, the JSON change won't reach liganx.com until
        # somebody runs deploy-frontend.sh. Print a reminder so it
        # doesn't get forgotten.
        if: success()
        run: |
          echo "::notice::Validation JSON refreshed and committed. Run ./deploy-frontend.sh locally to publish to liganx.com."
