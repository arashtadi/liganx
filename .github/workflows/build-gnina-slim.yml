name: Build GNINA slim worker

# Builds the TINY GNINA serverless worker image (ubuntu + python + runpod +
# handler, ~250 MB). All heavy libs (gnina, libtorch, CUDA runtime) live on a
# RunPod network volume, so this image cold-starts in seconds instead of
# slow-pulling 7.4 GB. Pushes to ghcr.io/${owner}/liganx-gnina-slim:latest.
#
# Manual trigger only.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runpod/gnina_worker/Dockerfile.slim
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/liganx-gnina-slim:latest
          provenance: false

      - name: Make package public (best effort)
        continue-on-error: true
        run: |
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/liganx-gnina-slim" \
            -d '{"visibility":"public"}' || echo "visibility change needs manual step"

      - name: Done
        run: echo "Pushed ghcr.io/${{ steps.owner.outputs.name }}/liganx-gnina-slim:latest"
