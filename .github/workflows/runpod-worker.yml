# Build the RunPod serverless worker image and push it to GHCR.
#
# Triggers on any change under runpod/** so the image stays in sync with
# the handler. The published image is what the RunPod serverless endpoint
# pulls — point that endpoint at:
#
#     ghcr.io/arashtadi/liganx-runpod-worker:latest
#
# We tag both `latest` (always points at HEAD of main) and the short
# commit SHA, so RunPod can pin a specific version if a future change
# regresses something.
#
# Why this exists rather than building locally: macOS doesn't have docker
# installed by default, and pushing from CI is more reproducible — same
# Linux build environment every time, no "works on my Mac" surprises.
name: build-runpod-worker

on:
  push:
    branches: [main]
    paths:
      - 'runpod/**'
      - '.github/workflows/runpod-worker.yml'
  workflow_dispatch:   # manual trigger from the Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./runpod
          file: ./runpod/Dockerfile
          # linux/amd64 only — RunPod's serverless workers are x86. Skip
          # arm64 to halve build time.
          platforms: linux/amd64
          push: true
          # Tag with both `latest` (RunPod's polling target) and the
          # short SHA (so we can pin if needed).
          tags: |
            ghcr.io/${{ github.repository_owner }}/liganx-runpod-worker:latest
            ghcr.io/${{ github.repository_owner }}/liganx-runpod-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "Pushed ghcr.io/${{ github.repository_owner }}/liganx-runpod-worker:latest"
          echo "Pushed ghcr.io/${{ github.repository_owner }}/liganx-runpod-worker:${{ github.sha }}"
          echo ""
          echo "RunPod endpoint config:"
          echo "  Image:  ghcr.io/${{ github.repository_owner }}/liganx-runpod-worker:latest"
          echo "  Worker: CPU"
          echo "  Min:    0"
          echo "  Max:    10"
