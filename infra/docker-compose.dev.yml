# Local development services for DeltaDock.
# Run from the repo root:    docker compose -f infra/docker-compose.dev.yml up -d
#
# Provides Postgres + Redis so the backend can talk to the same kinds of services
# it'll use in production (Neon Postgres + Upstash Redis). Backend and frontend
# stay on the host for fast reload.

services:
  postgres:
    image: postgres:16-alpine
    container_name: deltadock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deltadock
      POSTGRES_PASSWORD: deltadock
      POSTGRES_DB: deltadock
    ports:
      - "5432:5432"
    volumes:
      - deltadock-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deltadock -d deltadock"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: deltadock-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - deltadock-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  deltadock-postgres-data:
  deltadock-redis-data:
