; (Q1) Supervisord unit for fep_server on the RunPod pod.
;
; PROBLEM (pre-Q1):
;   fep_server is launched manually via nohup. When it dies (worker
;   crashes, OOM, kill -TERM), it stays dead until I SSH in and
;   relaunch it. Every recent FEP run has needed at least one manual
;   relaunch — happened with FEP #19 and FEP #20.
;
; FIX:
;   Run fep_server under supervisord. Auto-restart on crash with a
;   small backoff. Logs go to /workspace/fep_server.log (rotated by
;   supervisord). dock_server stays unmanaged for now (it's been
;   stable for weeks and is a separate concern).
;
; INSTALL (operator, one-time):
;   apt-get install -y supervisor
;   cp /workspace/supervisord_fep.conf /etc/supervisor/conf.d/fep_server.conf
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl start fep_server
;   supervisorctl status
;
; The deploy script in runpod/DEPLOY_FEP_POD.md should pull this file
; from raw.githubusercontent.com and apt-get install supervisor on
; first pod boot.
;
; STRICT SCOPE: this config governs ONLY fep_server. It does NOT
; touch dock_server.py, GoTTY, sshd, or any other pod-side service.
; The docking pipeline is unaffected.

[program:fep_server]
; Run from the conda env where openfe + openmm + pymbar live.
; The full conda-activate dance happens inside a wrapper script (one
; line, eval'd) so supervisord doesn't need to know about conda.
command=/bin/bash -lc "source /workspace/miniconda3/etc/profile.d/conda.sh && conda activate fep && exec /workspace/miniconda3/envs/fep/bin/uvicorn fep_server:app --host 0.0.0.0 --port 7862"
directory=/workspace
user=root
autostart=true
autorestart=true
; Wait 5s after a crash before relaunching, so a tight crash loop
; doesn't hammer the disk. Bumped to 30s after 3 consecutive failures.
startsecs=10
startretries=3
exitcodes=0
stopwaitsecs=30
; Stop signal: SIGTERM. The orphan canceller / cancel-flag plumbing
; uses cooperative cancellation, so a hard kill would lose in-flight
; MD progress. supervisord gives 30s before escalating to SIGKILL.
stopsignal=TERM
; Logs — append, never truncate. supervisord handles rotation per
; supervisord.conf's `logfile_maxbytes` (default 50 MB).
stdout_logfile=/workspace/fep_server.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/workspace/fep_server.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
redirect_stderr=true
; Process priority — fep_server is critical path, run at default
; (priority=999). dock_server (if added later) would be priority 100
; to start first.
priority=200
; Environment overrides — keep this minimal. The conda env supplies
; PATH, PYTHONPATH, etc.
environment=
    OPENMM_DEFAULT_PLATFORM="OpenCL",
    FEP_PERSIST_TOKEN_MAP="1"
