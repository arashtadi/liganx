[project]
name = "deltadock-pipeline"
version = "0.0.1"
description = "DeltaDock docking pipeline"
requires-python = ">=3.11"

dependencies = [
  "requests>=2.32",
  "pydantic>=2.9",
  # Heavy deps left optional so the package imports for unit tests without them:
  # rdkit, meeko, pdbfixer, openmm, prolif, biopython
]

[project.optional-dependencies]
full = [
  "rdkit>=2024.3.5",
  "meeko>=0.6",
  "biopython>=1.84",
  "pdbfixer>=1.9",
  "openmm>=8.1",
]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deltadock_pipeline"]
