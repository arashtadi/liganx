[project]
name = "deltadock"
version = "0.0.1"
description = "DeltaDock backend — mutation-aware docking platform"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlmodel>=0.0.22",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  # EmailStr validation in Pydantic 2 lazy-imports email-validator.
  # Required by routers/contact.py (ContactSubmission.email).
  "email-validator>=2.2",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "celery[redis]>=5.4",
  "redis>=5.1",
  # Pipeline (kept in backend deps for Phase 1 simplicity; will move to /pipeline later)
  "rdkit>=2024.3.5",
  "biopython>=1.84",
  "requests>=2.32",
  # freesasa is installed via conda-forge in the Dockerfile (no pip
  # wheel for py3.12, but conda-forge ships a pre-built binary). Local
  # dev without conda can `pip install freesasa --no-build-isolation`
  # if they want the BSA chip; interface_extras.compute_bsa wraps the
  # import in try/except so absence degrades gracefully.
  # Production persistence + object storage
  "psycopg2-binary>=2.9.9",
  "boto3>=1.35",
  # Auth — verify Supabase-issued JWTs against the project's JWKS (ES256
  # asymmetric keys). PyJWT has built-in PyJWKClient that handles fetch +
  # cache + kid lookup; cryptography backend is needed for ES256.
  "pyjwt[crypto]>=2.9",
  # Sentry — opt-in via SENTRY_DSN env var. Wrapped in try/except in
  # main.py, but installing here so prod actually reports errors.
  "sentry-sdk[fastapi,sqlalchemy]>=2.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deltadock"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  # A test that boots the app via `TestClient(app)` — which runs the
  # lifespan: startup migrations + the orphan reaper — and therefore
  # needs a live Postgres. The fast CI gate runs `-m "not requires_db"`
  # so it stays DB-free and deterministic. To run these, point
  # DATABASE_URL at a throwaway Postgres (e.g. a GitHub Actions
  # `services: postgres` container).
  "requires_db: needs a live Postgres connection (boots the app lifespan)",
]
