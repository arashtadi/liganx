[project]
name = "deltadock"
version = "0.0.1"
description = "DeltaDock backend — mutation-aware docking platform"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlmodel>=0.0.22",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "celery[redis]>=5.4",
  "redis>=5.1",
  # Pipeline (kept in backend deps for Phase 1 simplicity; will move to /pipeline later)
  "rdkit>=2024.3.5",
  "biopython>=1.84",
  "requests>=2.32",
  # Production persistence + object storage
  "psycopg2-binary>=2.9.9",
  "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deltadock"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
